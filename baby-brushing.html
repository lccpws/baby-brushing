<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宝宝刷牙小游戏 🦷</title>
<style>
  :root{
    --pink:#ff9bb3;
    --pink-deep:#ff6f91;
    --bg1:#ffe7c2;
    --bg2:#bfe9ff;
    --ink:#5b3b2e;
    --ink-soft:#9a7a6c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"PingFang SC","Baloo 2","Comic Sans MS",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh;padding:16px;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;
  }
  .app{
    width:100%;max-width:430px;
    background:#fff;border-radius:34px;
    box-shadow:0 22px 55px rgba(120,80,60,.18);
    padding:26px 22px 30px;
    display:flex;flex-direction:column;align-items:center;gap:16px;
    position:relative;overflow:hidden;
  }
  h1{font-size:26px;margin:2px 0 0;text-align:center;line-height:1.3;}
  .sub{font-size:14px;color:var(--ink-soft);text-align:center;line-height:1.65;margin:0;}
  .btn{
    border:none;border-radius:999px;cursor:pointer;
    font-family:inherit;font-weight:700;color:#fff;
    background:linear-gradient(180deg,#ffb24d,#ff8a3d);
    box-shadow:0 8px 18px rgba(255,138,61,.4);
    padding:18px 42px;font-size:23px;letter-spacing:.5px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(3px) scale(.98);box-shadow:0 4px 10px rgba(255,138,61,.35);}
  .screen{display:none;width:100%;flex-direction:column;align-items:center;gap:16px;}
  .screen.active{display:flex;}
  .timer{font-size:50px;font-weight:800;color:var(--pink-deep);line-height:1;letter-spacing:2px;
    text-shadow:0 3px 0 #ffe3ec;}
  .timer-label{font-size:13px;color:var(--ink-soft);margin-top:-8px;}
  .progress{width:100%;height:14px;border-radius:999px;background:#ffe3ec;overflow:hidden;}
  .progress>i{display:block;height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#7be0a4,#39c46f);transition:width 1s linear;}

  /* 口腔舞台（透明 PNG + 虫虫叠加） */
  .mouth-stage{
    position:relative;width:100%;max-width:360px;aspect-ratio:360/340;margin:2px auto;
  }
  .mouth-img{width:100%;height:100%;display:block;}

  .worm{position:absolute;z-index:3;transform:translate(-50%,-50%);}
  .worm.gone{
    transform:translate(-50%,-50%) scale(0) rotate(260deg);
    opacity:0;pointer-events:none;
    transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .4s ease;
  }
  .hint{font-size:14px;color:var(--ink-soft);text-align:center;}
  .done-card{display:none;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:8px 0;}
  .done-card.active{display:flex;}
  .done-emoji{font-size:68px;animation:pop .6s ease;}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .done-title{font-size:25px;font-weight:800;color:var(--pink-deep);}
  .done-sub{font-size:15px;color:var(--ink-soft);line-height:1.7;}
  .topbar{width:100%;display:flex;justify-content:flex-end;gap:8px;}
  .mini-btn{border:none;background:#fff0f4;color:var(--pink-deep);border-radius:999px;
    padding:7px 14px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:700;
    transition:transform .1s;}
  .mini-btn:active{transform:scale(.93);}
  .confetti{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;opacity:0;}
  @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(560px) rotate(540deg)}}
  .date-tag{
    background:linear-gradient(90deg,#ff9bb3,#ffd166);
    color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:4px 14px;
  }
</style>
</head>
<body>
<div class="app">
  <section class="screen active" id="screen-start">
    <h1>🦷 宝宝刷牙啦</h1>
    <p class="sub">嘴巴里藏着好多小虫虫～<br>用力刷牙，把虫虫都刷掉吧！</p>
    <div class="date-tag" id="date-tag">今日虫虫</div>
    <button class="btn" id="btn-start">开始刷牙 ▶</button>

<script>
(function(){
  const TOTAL=120, WORMS=8, STEP=TOTAL/WORMS;
  const $=id=>document.getElementById(id);
  const screenStart=$('screen-start'), screenBrush=$('screen-brush');
  const doneCard=$('done-card'), stage=$('stage');
  const timerEl=$('timer'), progressBar=$('progress-bar');
  const hintEl=$('hint'), dateTag=$('date-tag'), btnMute=$('btn-mute');

  let timer=null, remaining=TOTAL, removed=0, muted=false;
  let wormEls=[], todayTheme=null;

  const THEMES=[
    {name:'粉粉小肉虫', body:'#ff6b8a', bodyDark:'#c0284a', belly:'#ffb3c6', eye:'#fff', pupil:'#1a0008'},
    {name:'绿色菜青虫', body:'#6ab04c', bodyDark:'#2d6a14', belly:'#a8e063', eye:'#fff', pupil:'#0d2e00'},
    {name:'蓝色水虫',   body:'#4a9eff', bodyDark:'#1a5fc0', belly:'#b3daff', eye:'#fff', pupil:'#041540'},
    {name:'紫色毛毛虫', body:'#9b59b6', bodyDark:'#5a2080', belly:'#d2b4de', eye:'#fff', pupil:'#1a0030'},
    {name:'橙色毛毛虫', body:'#ff9f43', bodyDark:'#b05000', belly:'#ffe8b3', eye:'#fff', pupil:'#3a1800'},
    {name:'红色小红虫', body:'#e74c3c', bodyDark:'#8b1500', belly:'#f5b7b1', eye:'#fff', pupil:'#2a0000'},
    {name:'灰色土虫',   body:'#7f8c8d', bodyDark:'#3a4a4b', belly:'#ccd1d1', eye:'#fff', pupil:'#0a1012'},
  ];

  function getTodayTheme(){
    const d=new Date();
    const dayOfYear=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
    return THEMES[dayOfYear%THEMES.length];
  }

  function makeWormSVG(theme, animDelay, uid){
    const {body, bodyDark, belly, eye, pupil}=theme;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66 28" width="50" height="21">
  <style>
    @keyframes wHead${uid}{0%,100%{transform:translate(0,0)}30%{transform:translate(3px,-1px)}70%{transform:translate(-2px,1px)}}
    @keyframes wMid${uid} {0%,100%{transform:translate(0,0)}30%{transform:translate(2px,0)}70%{transform:translate(-1px,0)}}
    @keyframes wTail${uid}{0%,100%{transform:translate(0,0)}30%{transform:translate(1px,0)}70%{transform:translate(-0.5px,0)}}
    .h${uid}{animation:wHead${uid} ${(0.55+animDelay*0.1).toFixed(2)}s ease-in-out ${animDelay}s infinite;transform-box:fill-box;transform-origin:50% 50%}
    .m${uid}{animation:wMid${uid}  ${(0.55+animDelay*0.1).toFixed(2)}s ease-in-out ${(animDelay+0.08).toFixed(2)}s infinite;transform-box:fill-box;transform-origin:50% 50%}
    .t${uid}{animation:wTail${uid} ${(0.55+animDelay*0.1).toFixed(2)}s ease-in-out ${(animDelay+0.16).toFixed(2)}s infinite;transform-box:fill-box;transform-origin:50% 50%}
    @keyframes antL${uid}{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}70%{transform:rotate(8deg)}}
    @keyframes antR${uid}{0%,100%{transform:rotate(0)}30%{transform:rotate(12deg)}70%{transform:rotate(-8deg)}}
    .al${uid}{animation:antL${uid} ${(0.45+animDelay*0.08).toFixed(2)}s ease-in-out ${animDelay}s infinite;transform-box:fill-box;transform-origin:100% 100%}
    .ar${uid}{animation:antR${uid} ${(0.45+animDelay*0.08).toFixed(2)}s ease-in-out ${(animDelay+0.1).toFixed(2)}s infinite;transform-box:fill-box;transform-origin:0% 100%}
  </style>
  <ellipse cx="33" cy="27" rx="26" ry="4" fill="rgba(0,0,0,.14)"/>
  <g class="t${uid}">
    <ellipse cx="10" cy="14" rx="8"   ry="9.5" fill="${body}"/>
    <ellipse cx="10" cy="14" rx="5"   ry="7"   fill="${bodyDark}" opacity=".22"/>
    <ellipse cx="10" cy="15" rx="4.5" ry="6.5" fill="${belly}" opacity=".65"/>
    <circle cx="8"  cy="8"  r="1.2" fill="${bodyDark}" opacity=".3"/>
    <circle cx="10" cy="6"  r="1.2" fill="${bodyDark}" opacity=".3"/>
  </g>
  <g class="t${uid}">
    <ellipse cx="20" cy="13" rx="8.5" ry="10.5" fill="${body}"/>
    <ellipse cx="20" cy="13" rx="5"   ry="7.5"  fill="${belly}"   opacity=".6"/>
    <circle cx="17" cy="6"  r="1.2" fill="${bodyDark}" opacity=".3"/>
  </g>
  <g class="m${uid}">
    <ellipse cx="31" cy="12" rx="9"   ry="11" fill="${body}"/>
    <ellipse cx="31" cy="12" rx="5.5" ry="8"  fill="${belly}"   opacity=".55"/>
    <circle cx="27" cy="4"  r="1.2" fill="${bodyDark}" opacity=".3"/>
    <circle cx="33" cy="3"  r="1.0" fill="${bodyDark}" opacity=".25"/>
  </g>
  <g class="m${uid}">
    <ellipse cx="42" cy="11" rx="9"   ry="11.5" fill="${body}"/>
    <ellipse cx="42" cy="11" rx="5.5" ry="8.5"  fill="${belly}"   opacity=".5"/>
    <circle cx="38" cy="3"  r="1.2" fill="${bodyDark}" opacity=".3"/>
  </g>
  <g class="h${uid}">
    <ellipse cx="54" cy="10" rx="10.5" ry="12" fill="${body}"/>
    <ellipse cx="54" cy="10" rx="6.5"  ry="9"   fill="${belly}"   opacity=".45"/>
    <circle cx="49" cy="5"  r="5.5" fill="${eye}"/>
    <circle cx="49" cy="5"  r="3.3" fill="${pupil}"/>
    <circle cx="48" cy="4"  r="1.4" fill="rgba(255,255,255,.9)"/>
    <circle cx="59" cy="4"  r="5.5" fill="${eye}"/>
    <circle cx="59" cy="4"  r="3.3" fill="${pupil}"/>
    <circle cx="58" cy="3"  r="1.4" fill="rgba(255,255,255,.9)"/>
    <path d="M49 14 Q54 17.5 59 14" stroke="${bodyDark}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <g class="al${uid}">
      <line x1="50" y1="-1" x2="46" y2="-9" stroke="${body}" stroke-width="2" stroke-linecap="round"/>
      <circle cx="46" cy="-9" r="2.2" fill="${body}"/>
    </g>
    <g class="ar${uid}">
      <line x1="58" y1="-1" x2="62" y2="-9" stroke="${body}" stroke-width="2" stroke-linecap="round"/>
      <circle cx="62" cy="-9" r="2.2" fill="${body}"/>
    </g>
  </g>
</svg>`;
  }

  // 虫虫位置（基于口腔图片 360x340 的牙齿区域分布）
  // 上排牙齿: y≈20~42% | 舌头中部: y≈45~58% | 下排牙齿: y≈60~80%
  const POS_POOL=[
    // 上排牙齿间 (6个)
    {x:30,y:27},{x:40,y:24},{x:50,y:24},{x:60,y:23},{x:70,y:24},{x:75,y:29},
    // 舌头上 (3个)
    {x:32,y:55},{x:50,y:60},{x:68,y:55},
    // 下排牙齿间 (6个)
    {x:25,y:70},{x:30,y:74},{x:40,y:80},{x:53,y:80},{x:65,y:80},{x:80,y:65}
  ];

  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  let audioCtx=null;
  function beep(freq,dur,type){
    if(muted) return;
    try{
      audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=type||'sine';o.frequency.value=freq;
      o.connect(g);g.connect(audioCtx.destination);
      const t=audioCtx.currentTime;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.22,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.start(t);o.stop(t+dur);
    }catch(e){}
  }
  function cheer(){
    if(muted) return;
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle'),i*110));
  }
  function jingle(){
    if(muted) return;
    [440,550,660].forEach((f,i)=>setTimeout(()=>beep(f,.1,'triangle'),i*90));
  }

  function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

  const HINTS=['用力刷刷刷，虫虫正在逃跑…','再刷几下，又有虫虫溜走啦！',
    '宝宝好厉害，虫虫越来越少啦！','最后几只虫虫，刷刷刷！','太棒了，虫虫全没啦！'];
  function updateHint(r,n){hintEl.textContent=HINTS[Math.min(Math.floor(r/n*HINTS.length),HINTS.length-1)];}

  function buildWorms(){
    stage.querySelectorAll('.worm').forEach(w=>w.remove());
    const chosen=shuffle(POS_POOL).slice(0,WORMS);
    wormEls=chosen.map((p,i)=>{
      const w=document.createElement('div');
      w.className='worm';
      w.style.left=p.x+'%'; w.style.top=p.y+'%';
      const uid=Math.random().toString(36).slice(2,7);
      const delay=(i*0.13).toFixed(2);
      w.innerHTML=makeWormSVG(todayTheme, parseFloat(delay), uid);
      stage.appendChild(w);return w;
    });
  }

  function removeWorm(i){
    if(wormEls[i]&&!wormEls[i].classList.contains('gone')){
      wormEls[i].classList.add('gone');
      beep(650+Math.random()*300,.13,'square');
    }
  }

  function tick(){
    remaining--;
    timerEl.textContent=fmt(remaining);
    progressBar.style.width=((TOTAL-remaining)/TOTAL*100)+'%';
    const should=Math.floor((TOTAL-remaining)/STEP);
    while(removed<should&&removed<WORMS){removeWorm(removed);updateHint(removed+1,WORMS);removed++;}
    if(remaining<=0) finish();
  }

  function start(){
    clearInterval(timer);
    remaining=TOTAL;removed=0;
    todayTheme=getTodayTheme();
    dateTag.textContent='今日虫虫：'+todayTheme.name;
    doneCard.classList.remove('active');
    buildWorms();
    timerEl.textContent=fmt(remaining);
    progressBar.style.width='0%';
    updateHint(0,WORMS);
    screenStart.classList.remove('active');
    screenBrush.classList.add('active');
    timer=setInterval(tick,1000);
    jingle();
  }

  function finish(){
    clearInterval(timer);
    wormEls.forEach(w=>w.classList.add('gone'));
    progressBar.style.width='100%';
    hintEl.textContent='虫虫全跑掉啦，太厉害啦！';
    doneCard.classList.add('active');
    cheer();launchConfetti();
  }

  function launchConfetti(){
    const colors=['#ff9bb3','#ffd166','#7be0a4','#7cc0ff','#c792ea','#ff6b6b'];
    for(let i=0;i<32;i++){
      const c=document.createElement('div');
      c.className='confetti';
      c.style.left=Math.random()*100+'%';
      c.style.background=colors[i%colors.length];
      c.style.animation=`fall ${1.3+Math.random()*1.3}s ease-in ${Math.random()*.5}s forwards`;
      document.querySelector('.app').appendChild(c);
      setTimeout(()=>c.remove(),3200);
    }
  }

  $('btn-start').addEventListener('click',start);
  $('btn-again').addEventListener('click',start);
  $('btn-restart').addEventListener('click',start);
  btnMute.addEventListener('click',()=>{muted=!muted;btnMute.textContent=muted?'🔇 静音':'🔊 声音';});
})();
</script>
</body>
</html>
